<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <!--<div class="preload">
        

    </div>
    -->

    <div class="main-container">
        <div class = "boxsizer-horizontal-right">

            <h1 class="login-title">LOGIN</h1>

            <form action="/api/auth/login" method="post" class="login-form">

                <div class="login-inputLine">
                    <label for="username">用户名:</label>
                    <input type="text" id="username" name="username" required autocomplete="on"><br>
                </div>

                <div class="login-inputLine">
                    <label for="password">密&emsp;码:</label>
                    <input type="password" id="password" name="password" required autocomplete="on" ><br>
                </div>

                <div class="login-submitLine">
                    <input type="submit" value="登录">
                </div>
                    

            </form>
        </div>
    </div>

    <div class="background">
        <!-- <img
            src="{{ url_for('static',filename='photos/avemujica.jpg') }}"
            alt="背景"
        />
        -->
    </div>
</body>
<script src="{{ url_for('static', filename='js/login.js') }}" type="module"></script>
</html>
